<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theaters - QuickShow</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#ff4d6d',
                        darkbg: '#0a0a0f',
                        cardbg: '#161b28',
                    }
                }
            }
        }
    </script>

</head>

<body class="bg-darkbg text-white min-h-screen">

<!-- NAVBAR -->
<nav class="flex items-center justify-between px-10 py-6">

    <div class="text-2xl font-bold tracking-wider">
        <span class="text-brand">Q</span>uickShow
    </div>

    <div class="hidden md:flex space-x-8 bg-white/10 px-6 py-2 rounded-full backdrop-blur-md">

        <a href="/index.html" class="hover:text-brand transition">
            Home
        </a>

        <a href="/theaters.html" class="text-brand">
            Theaters
        </a>

    </div>

</nav>

<!-- PAGE TITLE -->
<section class="px-10 py-10">

    <h1 class="text-4xl font-bold mb-10">
        Explore Theaters
    </h1>

    <!-- THEATER GRID -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">

        <!-- CARD 1 -->
        <div class="bg-cardbg rounded-3xl overflow-hidden hover:scale-105 transition duration-300 shadow-lg">

            <img
                    src="https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?q=80&w=1200&auto=format&fit=crop"
                    class="h-60 w-full object-cover"
            >

            <div class="p-6">

                <h2 class="text-2xl font-bold mb-2">
                    Colombo Cineplex
                </h2>

                <p class="text-gray-400 mb-4">
                    Colombo 03
                </p>

                <div class="flex justify-between items-center">

                    <span class="text-sm text-gray-400">
                        120 Seats
                    </span>

                    <a
                            href="/seats.html"
                            class="bg-brand hover:bg-pink-600 px-5 py-2 rounded-full font-semibold transition"
                    >
                        View Seats
                    </a>

                </div>

            </div>

        </div>

        <!-- CARD 2 -->
        <div class="bg-cardbg rounded-3xl overflow-hidden hover:scale-105 transition duration-300 shadow-lg">

            <img
                    src="https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=1200&auto=format&fit=crop"
                    class="h-60 w-full object-cover"
            >

            <div class="p-6">

                <h2 class="text-2xl font-bold mb-2">
                    Majestic Cinema
                </h2>

                <p class="text-gray-400 mb-4">
                    Bambalapitiya
                </p>

                <div class="flex justify-between items-center">

                    <span class="text-sm text-gray-400">
                        150 Seats
                    </span>

                    <a
                            href="/seats.html"
                            class="bg-brand hover:bg-pink-600 px-5 py-2 rounded-full font-semibold transition"
                    >
                        View Seats
                    </a>

                </div>

            </div>

        </div>

    </div>

</section>

</body>
</html>
