<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | QuickShow</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#ff4d6d',
                        darkbg: '#0a0a0f',
                        cardbg: '#161b28',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-white font-sans min-h-screen flex flex-col">

<script src="/js/auth.js"></script>

<!-- Navigation -->
<nav class="flex items-center justify-between px-10 py-6 flex-wrap gap-4">
    <a href="/index.html" class="text-2xl font-bold tracking-wider">
        <span class="text-brand">Q</span>uickShow
    </a>
    <div class="hidden md:flex space-x-8 bg-white/10 px-6 py-2 rounded-full backdrop-blur-md">
        <a href="/index.html" class="hover:text-brand transition">Home</a>
        <a href="/index.html#now-showing" class="hover:text-brand transition">Movies</a>
        <a href="/theaters.html" class="hover:text-brand transition">Theaters</a>
        <a href="/index.html#releases" class="hover:text-brand transition">Releases</a>
        <a href="#" onclick="goSnacksNav(event)" class="hover:text-brand transition">Snacks</a>
    </div>
    <a href="/index.html" class="bg-white/10 hover:bg-white/20 px-6 py-2 rounded-full font-semibold transition">
        ← Back to Home
    </a>
</nav>

<!-- Main Content -->
<div class="flex-1 flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-md">

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="text-5xl mb-4">🎬</div>
            <h1 class="text-3xl font-bold mb-2">Create an Account</h1>
            <p class="text-gray-400">Join QuickShow and enjoy movies & snacks!</p>
        </div>

        <!-- Register Card -->
        <div class="bg-cardbg border border-white/10 rounded-2xl shadow-xl p-8">

            <!-- Error Message -->
            <div id="error-msg" class="hidden bg-red-500/20 border border-red-500/50 text-red-400 text-sm rounded-lg px-4 py-3 mb-5 text-center"></div>

            <!-- Success Message -->
            <div id="success-msg" class="hidden bg-green-500/20 border border-green-500/50 text-green-400 text-sm rounded-lg px-4 py-3 mb-5 text-center"></div>

            <div class="space-y-4">

                <!-- Username -->
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Email or Username <span class="text-brand">*</span></label>
                    <input type="text" id="username" placeholder="Email or Username"
                           class="w-full bg-darkbg border border-white/20 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-brand transition" />
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Password <span class="text-brand">*</span></label>
                    <input type="password" id="password" placeholder="Create a password"
                           class="w-full bg-darkbg border border-white/20 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-brand transition" />
                </div>

                <!-- Confirm Password -->
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Confirm Password <span class="text-brand">*</span></label>
                    <input type="password" id="confirm-password" placeholder="Re-enter your password"
                           class="w-full bg-darkbg border border-white/20 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-brand transition" />
                </div>

                <!-- Phone Number -->
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Phone Number</label>
                    <input type="tel" id="phone" placeholder="e.g: 077 123 4567"
                           class="w-full bg-darkbg border border-white/20 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-brand transition" />
                </div>

                <!-- Billing Address -->
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Billing Address</label>
                    <input type="text" id="billing-address" placeholder="e.g: 12 Main Street, Colombo"
                           class="w-full bg-darkbg border border-white/20 rounded-lg px-4 py-3 text-sm text-white focus:outline-none focus:border-brand transition" />
                </div>

            </div>

            <!-- Register Button -->
            <button onclick="submitRegister()" id="register-btn"
                    class="w-full mt-6 bg-brand hover:bg-pink-600 text-white rounded-full py-3 font-bold transition text-base">
                Create Account 🎬
            </button>

            <!-- Divider -->
            <div class="flex items-center my-5">
                <div class="flex-1 border-t border-white/10"></div>
                <span class="px-4 text-gray-500 text-sm">or</span>
                <div class="flex-1 border-t border-white/10"></div>
            </div>

            <!-- Login Link -->
            <div class="text-center text-sm text-gray-400">
                Already have an account?
                <a href="/index.html" onclick="openLoginFromRegister(event)"
                   class="text-brand hover:text-pink-400 font-semibold transition">
                    Sign in here
                </a>
            </div>

        </div>
    </div>
</div>

<script>
    async function submitRegister() {
        const username       = document.getElementById('username').value.trim();
        const password       = document.getElementById('password').value.trim();
        const confirmPass    = document.getElementById('confirm-password').value.trim();
        const phone          = document.getElementById('phone').value.trim();
        const billingAddress = document.getElementById('billing-address').value.trim();

        const errorMsg   = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');
        const btn        = document.getElementById('register-btn');

        // Hide previous messages
        errorMsg.classList.add('hidden');
        successMsg.classList.add('hidden');

        // Validation
        if (!username) {
            showError('⚠️ Please enter a username.');
            return;
        }
        if (username.length < 3) {
            showError('⚠️ Username must be at least 3 characters.');
            return;
        }
        if (!password) {
            showError('⚠️ Please enter a password.');
            return;
        }
        if (password.length < 6) {
            showError('⚠️ Password must be at least 6 characters.');
            return;
        }
        if (password !== confirmPass) {
            showError('⚠️ Passwords do not match. Please try again.');
            return;
        }
        if (phone && isNaN(parseInt(phone))) {
            showError('⚠️ Please enter a valid phone number.');
            return;
        }

        // Disable button while loading
        btn.textContent = 'Creating Account...';
        btn.disabled = true;
        btn.classList.add('opacity-60');

        try {
            const res = await fetch('/api/users/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username,
                    password,
                    phoneNumber: phone || '0',
                    billingAddress: billingAddress || ''
                })
            });

            let data = {};
            try {
                data = await res.json();
            } catch (e) {
                showError('❌ Server error. Please try again.');
                return;
            }

            if (res.ok) {
                const displayName = data.username || username;
                try {
                    AuthService.setSession({
                        userId: data.userId ?? data.userID,
                        username: displayName,
                        type: data.type || 'Customer'
                    });
                } catch (e) {
                    showError('❌ Account created but sign-in failed. Please log in from home.');
                    return;
                }

                successMsg.textContent = '🎉 Welcome, ' + displayName + '!';
                successMsg.classList.remove('hidden');

                ['username','password','confirm-password','phone','billing-address']
                    .forEach(id => document.getElementById(id).value = '');

                const params = new URLSearchParams(window.location.search);
                let target = params.get('next') || '/index.html';
                if (!target.startsWith('/')) {
                    target = '/index.html';
                }
                if (params.get('checkout') === '1') {
                    target += (target.includes('?') ? '&' : '?') + 'resumeCheckout=1';
                }

                setTimeout(() => {
                    window.location.href = target;
                }, 1500);

            } else {
                showError('❌ ' + (data.error || 'Registration failed. Please try again.'));
            }

        } catch (err) {
            showError('❌ Something went wrong. Please try again.');
        } finally {
            btn.textContent = 'Create Account 🎬';
            btn.disabled = false;
            btn.classList.remove('opacity-60');
        }
    }

    function showError(msg) {
        const errorMsg = document.getElementById('error-msg');
        errorMsg.textContent = msg;
        errorMsg.classList.remove('hidden');
        // Scroll to top of card
        errorMsg.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function goSnacksNav(event) {
        if (event) {
            event.preventDefault();
        }
        window.location.href = AuthService.getSnacksPageUrl();
    }

    function openLoginFromRegister(event) {
        event.preventDefault();
        const next = new URLSearchParams(window.location.search).get('next');
        const q = next ? ('?login=1&next=' + encodeURIComponent(next)) : '?login=1';
        window.location.href = '/index.html' + q;
    }

    // Allow Enter key to submit
    document.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') submitRegister();
    });
</script>

</body>
</html>
