<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snacks | QuickShow Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#ff4d6d',
            darkbg: '#0a0a0f',
            cardbg: '#161b28',
          }
        }
      }
    }
  </script>
</head>
<body class="bg-darkbg text-white font-sans min-h-screen">

<!-- Navigation -->
<nav class="flex items-center justify-between px-10 py-6">
  <div class="flex items-center space-x-2">
    <a href="/index.html" class="text-2xl font-bold tracking-wider"><span class="text-brand">Q</span>uickShow</a>
  </div>
  <div class="hidden md:flex space-x-8 bg-white/10 px-6 py-2 rounded-full backdrop-blur-md">
    <a href="/index.html" class="hover:text-brand transition">Home</a>
    <a href="#" class="hover:text-brand transition">Movies</a>
    <a href="#" class="hover:text-brand transition">Theaters</a>
    <a href="#" class="hover:text-brand transition">Releases</a>
    <a href="/snacks-admin.html" class="text-brand transition font-semibold">Snacks</a>
  </div>
  <div class="flex items-center space-x-4">
    <span id="admin-user-label" class="hidden text-sm text-gray-400"></span>
    <a href="/snacks-user.html" class="bg-white/10 hover:bg-white/20 px-5 py-2 rounded-full text-sm font-semibold transition">
      Customer View
    </a>
    <button type="button" onclick="adminSignOut()"
            class="bg-brand/20 hover:bg-brand/40 text-brand px-5 py-2 rounded-full text-sm font-semibold transition">
      Sign out
    </button>
    <a href="/index.html" class="bg-white/10 hover:bg-white/20 px-6 py-2 rounded-full font-semibold transition">
      ← Back
    </a>
  </div>
</nav>

<!-- Page Header -->
<div class="px-10 py-8 flex items-center justify-between">
  <div>
    <h1 class="text-4xl font-bold">Snack <span class="text-brand">Management</span></h1>
    <p class="text-gray-400 mt-2">Add, edit, or remove snacks from the menu</p>
  </div>
  <button onclick="openAddModal()"
          class="bg-brand hover:bg-pink-600 px-6 py-3 rounded-full font-semibold flex items-center space-x-2 transition">
    <span>+ Add Snack</span>
  </button>
</div>

<!-- Category Filter Tabs -->
<div class="px-10 mb-8 flex space-x-4">
  <button onclick="filterCategory('All')" id="tab-All"
          class="tab-btn bg-brand px-5 py-2 rounded-full text-sm font-semibold transition">All</button>
  <button onclick="filterCategory('Food')" id="tab-Food"
          class="tab-btn bg-white/10 hover:bg-white/20 px-5 py-2 rounded-full text-sm font-semibold transition">Food</button>
  <button onclick="filterCategory('Beverage')" id="tab-Beverage"
          class="tab-btn bg-white/10 hover:bg-white/20 px-5 py-2 rounded-full text-sm font-semibold transition">Beverage</button>
  <button onclick="filterCategory('Sweets')" id="tab-Sweets"
          class="tab-btn bg-white/10 hover:bg-white/20 px-5 py-2 rounded-full text-sm font-semibold transition">Sweets</button>
</div>

<!-- Snack Grid -->
<section class="px-10 pb-16">
  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6" id="snack-grid"></div>
  <div id="empty-state" class="hidden text-center py-20 text-gray-500">
    <p class="text-2xl mb-2">No snacks found</p>
    <p class="text-sm">Try a different category or add a new snack</p>
  </div>
</section>

<!-- ── ADD SNACK MODAL ──────────────────────────────────────── -->
<div id="add-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
  <div class="bg-cardbg rounded-2xl shadow-xl p-8 w-full max-w-md mx-4">
    <h2 class="text-xl font-semibold text-white mb-6">Add <span class="text-brand">Snack</span></h2>
    <div class="space-y-4">
      <div>
        <label class="block text-sm text-gray-300 mb-1">Snack Name</label>
        <input type="text" id="add-name" placeholder="e.g., Popcorn"
               class="w-full bg-darkbg border border-white/20 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-brand" />
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Price (Rs.)</label>
        <input type="number" id="add-price" placeholder="e.g., 350.00" step="0.01" min="0.01"
               class="w-full bg-darkbg border border-white/20 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-brand" />
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Category</label>
        <select id="add-category"
                class="w-full bg-darkbg border border-white/20 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-brand">
          <option value="">Select a category</option>
          <option value="Food">Food</option>
          <option value="Beverage">Beverage</option>
          <option value="Sweets">Sweets</option>
        </select>
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Image Path</label>
        <input type="text" id="add-imagePath" placeholder="e.g., images/popcorn.png"
               class="w-full bg-darkbg border border-white/20 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-brand" />
      </div>
    </div>
    <p id="add-message" class="hidden text-sm mt-3"></p>
    <div class="mt-6 flex gap-3">
      <button onclick="submitAddSnack()"
              class="flex-1 bg-brand hover:bg-pink-600 text-white rounded-lg px-4 py-2 text-sm font-semibold transition">Save Snack</button>
      <button onclick="closeAddModal()"
              class="flex-1 bg-white/10 hover:bg-white/20 rounded-lg px-4 py-2 text-sm text-white transition">Cancel</button>
    </div>
  </div>
</div>

<!-- ── EDIT SNACK MODAL ─────────────────────────────────────── -->
<div id="edit-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
  <div class="bg-cardbg rounded-2xl shadow-xl p-8 w-full max-w-md mx-4">
    <h2 class="text-xl font-semibold text-white mb-6">Edit <span class="text-brand">Snack</span></h2>
    <input type="hidden" id="edit-snackId" />
    <div class="space-y-4">
      <div>
        <label class="block text-sm text-gray-300 mb-1">Snack Name</label>
        <input type="text" id="edit-name"
               class="w-full bg-darkbg border border-white/20 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-brand" />
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Price (Rs.)</label>
        <input type="number" id="edit-price" step="0.01" min="0.01"
               class="w-full bg-darkbg border border-white/20 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-brand" />
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Category</label>
        <select id="edit-category"
                class="w-full bg-darkbg border border-white/20 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-brand">
          <option value="Food">Food</option>
          <option value="Beverage">Beverage</option>
          <option value="Sweets">Sweets</option>
        </select>
      </div>
      <div>
        <label class="block text-sm text-gray-300 mb-1">Image Path</label>
        <input type="text" id="edit-imagePath"
               class="w-full bg-darkbg border border-white/20 rounded-lg px-4 py-2 text-sm text-white focus:outline-none focus:border-brand" />
      </div>
    </div>
    <p id="edit-message" class="hidden text-sm mt-3"></p>
    <div class="mt-6 flex gap-3">
      <button onclick="submitEditSnack()"
              class="flex-1 bg-brand hover:bg-pink-600 text-white rounded-lg px-4 py-2 text-sm font-semibold transition">Update Snack</button>
      <button onclick="closeEditModal()"
              class="flex-1 bg-white/10 hover:bg-white/20 rounded-lg px-4 py-2 text-sm text-white transition">Cancel</button>
    </div>
  </div>
</div>

<!-- ── DELETE CONFIRM MODAL ────────────────────────────────── -->
<div id="delete-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
  <div class="bg-cardbg rounded-2xl shadow-xl p-8 w-full max-w-sm mx-4 text-center">
    <h2 class="text-xl font-semibold text-white mb-2">Delete Snack?</h2>
    <p class="text-gray-400 text-sm mb-6">This action cannot be undone.</p>
    <input type="hidden" id="delete-snackId" />
    <div class="flex gap-3">
      <button onclick="confirmDelete()"
              class="flex-1 bg-brand hover:bg-pink-600 text-white rounded-lg px-4 py-2 text-sm font-semibold transition">Yes, Delete</button>
      <button onclick="closeDeleteModal()"
              class="flex-1 bg-white/10 hover:bg-white/20 rounded-lg px-4 py-2 text-sm text-white transition">Cancel</button>
    </div>
  </div>
</div>

<script src="/js/auth.js"></script>

  function requireAdminAccess() {
    if (!AuthService.isAuthenticated()) {
      window.location.href = '/index.html';
      return false;
    }
    if (!AuthService.isAdmin()) {
      window.location.href = '/snacks-user.html';
      return false;
    }
    const user = AuthService.getCurrentUser();
    const label = document.getElementById('admin-user-label');
    label.textContent = 'Admin: ' + user.username;
    label.classList.remove('hidden');
    return true;
  }

  // Default images per category if snack name not found
  const categoryDefaults = {
    'Food':     'https://images.unsplash.com/photo-1585647347483-22b66260dfff?w=500&q=80',
    'Beverage': 'https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=500&q=80',
    'Sweets':   'https://images.unsplash.com/photo-1582058091505-f87a2e55a40f?w=500&q=80',
  };

  // ── Get image URL by snack name ────────────────────────────────
  function getSnackImage(name, category) {
    const key = name.toLowerCase().trim();
    return snackImages[key] || categoryDefaults[category] ||
            'https://images.unsplash.com/photo-1585647347483-22b66260dfff?w=500&q=80';
  }

  // ── Fetch all snacks from API ──────────────────────────────────
  async function loadSnacks() {
    try {
      const res = await fetch('/api/snacks');
      allSnacks = await res.json();
      renderSnacks(allSnacks);
    } catch (err) {
      console.error('Failed to load snacks:', err);
    }
  }

  // ── Render snack cards ─────────────────────────────────────────
  function renderSnacks(snacks) {
    const grid = document.getElementById('snack-grid');
    const empty = document.getElementById('empty-state');
    grid.innerHTML = '';

    if (snacks.length === 0) {
      empty.classList.remove('hidden');
      return;
    }
    empty.classList.add('hidden');

    snacks.forEach(snack => {
      const imageUrl = getSnackImage(snack.name, snack.category);
      const card = `
                <div class="bg-cardbg rounded-2xl p-4 flex flex-col transition hover:-translate-y-1 hover:shadow-lg hover:shadow-brand/20">
                    <img src="${imageUrl}"
                         alt="${snack.name}"
                         class="rounded-xl h-48 object-cover w-full mb-4"
                         onerror="this.src='https://images.unsplash.com/photo-1585647347483-22b66260dfff?w=500&q=80'">
                    <span class="text-xs text-brand font-semibold uppercase tracking-wider mb-1">${snack.category}</span>
                    <h3 class="text-lg font-bold mb-1">${snack.name}</h3>
                    <p class="text-sm text-gray-400 mb-1">ID: ${snack.snackId}</p>
                    <p class="text-brand font-bold text-lg mb-4">Rs. ${snack.price.toFixed(2)}</p>
                    <div class="mt-auto flex gap-2">
                        <button onclick="openEditModal('${snack.snackId}')"
                                class="flex-1 bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-full text-sm font-semibold transition">
                            ✏️ Edit
                        </button>
                        <button onclick="openDeleteModal('${snack.snackId}')"
                                class="flex-1 bg-brand/20 hover:bg-brand/40 px-3 py-1.5 rounded-full text-sm font-semibold text-brand transition">
                            🗑 Delete
                        </button>
                    </div>
                </div>
            `;
      grid.innerHTML += card;
    });
  }

  // ── Category filter ────────────────────────────────────────────
  function filterCategory(category) {
    currentCategory = category;
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.classList.remove('bg-brand');
      btn.classList.add('bg-white/10');
    });
    document.getElementById('tab-' + category).classList.add('bg-brand');
    document.getElementById('tab-' + category).classList.remove('bg-white/10');
    if (category === 'All') {
      renderSnacks(allSnacks);
    } else {
      renderSnacks(allSnacks.filter(s => s.category === category));
    }
  }

  // ── ADD MODAL ──────────────────────────────────────────────────
  function openAddModal() {
    document.getElementById('add-modal').classList.remove('hidden');
    document.getElementById('add-message').classList.add('hidden');
  }

  function closeAddModal() {
    document.getElementById('add-modal').classList.add('hidden');
    ['add-name','add-price','add-category','add-imagePath']
            .forEach(id => document.getElementById(id).value = '');
  }

  function generateNextSnackId() {
    let maxNum = 0;
    allSnacks.forEach(s => {
      const match = /^S(\d+)$/i.exec(s.snackId || '');
      if (match) {
        maxNum = Math.max(maxNum, parseInt(match[1], 10));
      }
    });
    return 'S' + String(maxNum + 1).padStart(3, '0');
  }

  async function submitAddSnack() {
    const autoId = generateNextSnackId();
    const snack = {
      snackId:   autoId,
      name:      document.getElementById('add-name').value.trim(),
      price:     parseFloat(document.getElementById('add-price').value),
      category:  document.getElementById('add-category').value,
      imagePath: document.getElementById('add-imagePath').value.trim()
    };
    const msg = document.getElementById('add-message');
    if (!snack.name || !snack.price || !snack.category) {
      msg.textContent = '⚠️ Please fill in all required fields.';
      msg.className = 'text-sm mt-3 text-yellow-400';
      msg.classList.remove('hidden');
      return;
    }
    try {
      const res = await fetch('/api/snacks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(snack)
      });
      if (res.ok) {
        msg.textContent = '✅ Snack added successfully!';
        msg.className = 'text-sm mt-3 text-green-400';
        msg.classList.remove('hidden');
        await loadSnacks();
        setTimeout(closeAddModal, 1000);
      } else {
        const err = await res.text();
        msg.textContent = '❌ ' + err;
        msg.className = 'text-sm mt-3 text-brand';
        msg.classList.remove('hidden');
      }
    } catch (err) { console.error(err); }
  }

  // ── EDIT MODAL ─────────────────────────────────────────────────
  function openEditModal(snackId) {
    const snack = allSnacks.find(s => s.snackId === snackId);
    if (!snack) return;
    document.getElementById('edit-snackId').value   = snack.snackId;
    document.getElementById('edit-name').value      = snack.name;
    document.getElementById('edit-price').value     = snack.price;
    document.getElementById('edit-category').value  = snack.category;
    document.getElementById('edit-imagePath').value = snack.imagePath;
    document.getElementById('edit-message').classList.add('hidden');
    document.getElementById('edit-modal').classList.remove('hidden');
  }

  function closeEditModal() {
    document.getElementById('edit-modal').classList.add('hidden');
  }

  async function submitEditSnack() {
    const snackId = document.getElementById('edit-snackId').value;
    const snack = {
      snackId,
      name:      document.getElementById('edit-name').value.trim(),
      price:     parseFloat(document.getElementById('edit-price').value),
      category:  document.getElementById('edit-category').value,
      imagePath: document.getElementById('edit-imagePath').value.trim()
    };
    const msg = document.getElementById('edit-message');
    try {
      const res = await fetch(`/api/snacks/${snackId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(snack)
      });
      if (res.ok) {
        msg.textContent = '✅ Snack updated successfully!';
        msg.className = 'text-sm mt-3 text-green-400';
        msg.classList.remove('hidden');
        await loadSnacks();
        setTimeout(closeEditModal, 1000);
      } else {
        msg.textContent = '❌ Failed to update snack.';
        msg.className = 'text-sm mt-3 text-brand';
        msg.classList.remove('hidden');
      }
    } catch (err) { console.error(err); }
  }

  // ── DELETE MODAL ───────────────────────────────────────────────
  function openDeleteModal(snackId) {
    document.getElementById('delete-snackId').value = snackId;
    document.getElementById('delete-modal').classList.remove('hidden');
  }

  function closeDeleteModal() {
    document.getElementById('delete-modal').classList.add('hidden');
  }

  async function confirmDelete() {
    const snackId = document.getElementById('delete-snackId').value;
    try {
      const res = await fetch(`/api/snacks/${snackId}`, { method: 'DELETE' });
      if (res.ok) {
        closeDeleteModal();
        await loadSnacks();
      }
    } catch (err) { console.error(err); }
  }

  if (requireAdminAccess()) {
    loadSnacks();
  }
</script>
</body>
</html>
