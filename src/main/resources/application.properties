spring.application.name=cinema

# ---------------------------------------------------------------------------
# H2 DATABASE — FILE-BASED PERSISTENCE (Movie & all modules share this datasource)
# ---------------------------------------------------------------------------
# BUG FIX: jdbc:h2:mem:movieDB stored data only in RAM — all movies were lost on restart.
# FIX: Use a file URL so H2 writes to ./data/cinema-db.mv.db on disk permanently.
# The ./data/ folder is created automatically next to the project root on first run.
spring.datasource.url=jdbc:h2:file:./data/cinema-db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.sql.init.mode=always
