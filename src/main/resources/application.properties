spring.application.name=cinema
# In-memory H2 (data cleared when app stops). Orders still save while the app is running.
spring.datasource.url=jdbc:h2:mem:movieDB
# Uncomment the line below (and comment mem URL above) to keep users, snacks, and orders on disk:
# spring.datasource.url=jdbc:h2:file:./data/moviedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Theater, Seat, and Booking @Entity tables are synced to H2 on startup (see TheaterSeatSeeder)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.sql.init.mode=always