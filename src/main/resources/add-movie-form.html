<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Movie</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card bg-secondary text-white p-4">
                <h3 class="text-center text-warning mb-4">Add a New Movie</h3>

                <form th:action="@{/movies/save}" th:object="${newMovie}" method="POST">

                    <div class="mb-3">
                        <label class="form-label">Movie Title</label>
                        <input type="text" class="form-control" th:field="*{title}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Genre (Action, Comedy, etc.)</label>
                        <input type="text" class="form-control" th:field="*{genre}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Duration (in minutes)</label>
                        <input type="number" class="form-control" th:field="*{durationMinutes}" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Poster Image URL (Link)</label>
                        <input type="text" class="form-control" th:field="*{posterUrl}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
                    </div>

                    <button type="submit" class="btn btn-warning w-100">Save Movie</button>
                    <a th:href="@{/movies/catalog}" class="btn btn-outline-light w-100 mt-2">Cancel</a>

                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
