<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard - Movies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { brand: '#3F000F', darkbg: '#0a0a0f', cardbg: '#161b28' } }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-white font-sans min-h-screen p-10">

<div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-8">
        <h1 class="text-3xl font-bold border-l-4 border-brand pl-4">Movies Dashboard</h1>
        <a href="/movies/add" class="bg-brand hover:opacity-80 px-6 py-2 rounded-full font-semibold transition shadow-lg">
            + Add New Movie
        </a>
    </div>

    <div class="bg-cardbg rounded-2xl p-6 shadow-2xl border border-gray-800">
        <table class="w-full text-left border-collapse">
            <thead>
            <tr class="border-b border-brand text-gray-400">
                <th class="py-3 px-4">Movie ID</th>
                <th class="py-3 px-4">Poster</th>
                <th class="py-3 px-4">Title</th>
                <th class="py-3 px-4">Showtimes</th>
                <th class="py-3 px-4">Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="movie : ${movies}" class="border-b border-gray-800 hover:bg-white/5 transition">
                <td class="py-4 px-4 text-brand font-bold" th:text="${movie.movieId}">MOV-123</td>
                <td class="py-4 px-4">
                    <img th:src="${movie.poster}" class="w-16 h-24 object-cover rounded-md shadow-md border border-gray-700" alt="Poster">
                </td>
                <td class="py-4 px-4">
                    <div class="font-bold text-lg text-white" th:text="${movie.title}">Movie Title</div>
                    <div class="text-sm text-gray-500 mt-1" th:text="${movie.summary}">Summary...</div>
                </td>
                <td class="py-4 px-4 text-sm text-gray-400" th:text="${movie.showtimes}">10:00 AM</td>
                <td class="py-4 px-4">
                    <div class="flex space-x-4">
                        <a th:href="@{/movies/view/{id}(id=${movie.movieId})}" class="text-blue-400 hover:text-blue-300 transition">View</a>
                        <a th:href="@{/movies/edit/{id}(id=${movie.movieId})}" class="text-green-400 hover:text-green-300 transition">Edit</a>
                        <form th:action="@{/movies/delete/{id}(id=${movie.movieId})}" method="post" class="inline">
                            <button type="submit" class="text-red-500 hover:text-red-400 transition" onclick="return confirm('Are you sure you want to delete this movie?')">Delete</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
