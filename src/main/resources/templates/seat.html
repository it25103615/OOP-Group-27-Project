<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Seats</title>

    <style>

        body{
            background:#050816;
            color:white;
            font-family:Arial;
            text-align:center;
        }

        .title{
            font-size:40px;
            margin-top:40px;
        }

        .screen{
            width:60%;
            margin:40px auto;
            background:white;
            color:black;
            padding:15px;
            border-radius:10px;
            font-weight:bold;
        }

        .seat-container{
            margin-top:50px;
        }

        .row{
            margin-bottom:20px;
        }

        .seat{
            width:55px;
            height:55px;
            border:none;
            border-radius:12px;
            margin:5px;
            font-weight:bold;
            cursor:pointer;
        }

        .available{
            background:#22c55e;
            color:white;
        }

        .reserved{
            background:#ef4444;
            color:white;
        }

        .vip{
            background:#f59e0b;
            color:black;
        }

    </style>

</head>

<body>

<div class="title">
    Colombo Cineplex
</div>

<div class="screen">
    SCREEN
</div>

<div class="seat-container">

    <div class="row">

        <button class="seat available">A1</button>
        <button class="seat available">A2</button>
        <button class="seat reserved">A3</button>
        <button class="seat vip">A4</button>
        <button class="seat vip">A5</button>

    </div>

    <div class="row">

        <button class="seat available">B1</button>
        <button class="seat reserved">B2</button>
        <button class="seat available">B3</button>
        <button class="seat available">B4</button>
        <button class="seat vip">B5</button>

    </div>

</div>

</body>
</html>
