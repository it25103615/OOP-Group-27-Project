<!DOCTYPE html>
<!-- ADMIN — Add Movie form. POST /movies/add → MovieManager.addMovie (Admin only). -->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Movie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: '#3F000F', darkbg: '#0a0a0f', cardbg: '#161b28' } } } }
    </script>
</head>
<body class="bg-darkbg text-white font-sans min-h-screen flex items-center justify-center py-12">
<div class="w-full max-w-lg bg-cardbg border border-brand/30 rounded-2xl p-8 shadow-lg shadow-brand/10">
    <h2 class="text-3xl font-bold text-center mb-6">Add <span class="text-brand">Movie</span></h2>

    <div th:if="${param.success}" class="bg-green-500/10 border border-green-500 text-green-500 text-center px-4 py-2 rounded-lg mb-6">
        Success! The movie has been added.
    </div>
    <div th:if="${error}" class="bg-red-500/10 border border-red-500 text-red-400 text-center px-4 py-2 rounded-lg mb-6" th:text="${error}">
        Validation error.
    </div>

    <form th:action="@{/movies/add}" th:object="${movie}" method="post" class="space-y-5">

        <div>
            <label class="block text-sm font-medium text-gray-400 mb-1">Movie Title</label>
            <input type="text" th:field="*{title}" class="w-full bg-darkbg border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-brand" placeholder="e.g. Guardians of the Galaxy" required>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-400 mb-1">Genre</label>
            <input type="text" th:field="*{genre}" class="w-full bg-darkbg border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-brand" placeholder="e.g. Action, Sci-Fi" required>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-400 mb-1">Poster Image URL</label>
            <input type="text" th:field="*{poster}" class="w-full bg-darkbg border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-brand" required>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-400 mb-1">Movie Summary</label>
            <textarea th:field="*{summary}" rows="3" class="w-full bg-darkbg border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-brand" required></textarea>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-400 mb-1">Showtimes</label>
            <input type="text" th:field="*{showtime}" class="w-full bg-darkbg border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-brand" placeholder="e.g., 10:00 AM, 6:00 PM" required>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-400 mb-1">Assigned Theater ID</label>
            <input type="text" th:field="*{theaterId}" class="w-full bg-darkbg border border-gray-700 rounded-lg px-4 py-2 focus:outline-none focus:border-brand" placeholder="e.g., TH-01" required>
        </div>

        <div class="pt-4 flex gap-4">
            <button type="submit" class="w-full bg-brand hover:opacity-80 py-3 rounded-full font-bold transition shadow-lg text-white">Save Movie</button>
            <a th:href="@{/movies/dashboard}" class="w-full text-center border border-gray-600 hover:bg-gray-800 py-3 rounded-full font-bold transition text-gray-300">Back to Dashboard</a>
        </div>
    </form>
</div>

<script src="/js/auth.js"></script>
<script>
    async function requireAdminAccess() {
        if (!AuthService.isAuthenticated() || !AuthService.isAdmin()) {
            window.location.href = '/movies/list';
            return;
        }
        await fetch('/movies/session/sync', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userType: AuthService.getCurrentUser().type })
        });
    }
    requireAdminAccess();
</script>
</body>
</html>
