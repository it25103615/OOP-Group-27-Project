<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Movie | Admin Portal</title>

    <!-- Bootstrap 5 CSS for layout and responsiveness -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS for a premium, futuristic dark theme -->
    <style>
        body {
            background-color: #0b0c10;
            color: #c5c6c7;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .cosmic-card {
            background: #1f2833;
            border: 1px solid #45a29e;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(69, 162, 158, 0.15); /* Subtle glowing halo effect */
            margin-top: 50px;
            margin-bottom: 50px;
        }
        .form-control {
            background-color: #0b0c10;
            border: 1px solid #45a29e;
            color: #ffffff;
        }
        .form-control:focus {
            background-color: #0b0c10;
            border-color: #66fcf1;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(102, 252, 241, 0.4);
        }
        .form-control::placeholder {
            color: #6c757d;
        }
        .btn-premium {
            background: linear-gradient(45deg, #45a29e, #66fcf1);
            color: #0b0c10;
            font-weight: bold;
            border: none;
            transition: all 0.3s ease;
        }
        .btn-premium:hover {
            background: linear-gradient(45deg, #66fcf1, #45a29e);
            color: #0b0c10;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 252, 241, 0.4);
        }
        .form-label {
            color: #66fcf1;
            font-weight: 500;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <div class="cosmic-card p-5">
                <h2 class="text-center mb-4" style="color: #ffffff; font-weight: 300; letter-spacing: 1px;">
                    Add <span style="color: #66fcf1; font-weight: 600;">Movie</span>
                </h2>

                <!-- Success Alert: This shows up when the URL has ?success at the end -->
                <div th:if="${param.success}" class="alert alert-success bg-transparent border-success text-success text-center mb-4">
                    Success! The movie has been added to the database.
                </div>

                <!-- The Thymeleaf Form -->
                <form th:action="@{/movies/add}" th:object="${movie}" method="post">

                    <!-- Poster Field -->
                    <div class="mb-4">
                        <label class="form-label">Poster Image URL</label>
                        <!-- th:field="*{poster}" connects exactly to the getPoster()/setPoster() in Movie.java -->
                        <input type="text" class="form-control" th:field="*{poster}" placeholder="https://example.com/images/poster.jpg" required>
                    </div>

                    <!-- Summary Field -->
                    <div class="mb-4">
                        <label class="form-label">Movie Summary</label>
                        <textarea class="form-control" th:field="*{summary}" rows="4" placeholder="Enter a captivating description of the film..." required></textarea>
                    </div>

                    <!-- Showtimes Field -->
                    <div class="mb-4">
                        <label class="form-label">Showtimes</label>
                        <input type="text" class="form-control" th:field="*{showtime}" placeholder="e.g., 10:00 AM, 1:30 PM, 6:00 PM" required>
                    </div>

                    <!-- Theater ID Field -->
                    <div class="mb-5">
                        <label class="form-label">Assigned Theater ID</label>
                        <input type="text" class="form-control" th:field="*{theaterId}" placeholder="e.g., TH-01" required>
                    </div>

                    <!-- Action Buttons -->
                    <div class="d-grid gap-3">
                        <button type="submit" class="btn btn-premium btn-lg">Save Movie</button>
                        <!-- The cancel button currently reloads the page, you can route this to an admin dashboard later -->
                        <a th:href="@{/movies/add}" class="btn btn-outline-light">Cancel / Clear</a>
                    </div>

                </form>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS (Optional but good for future interactive elements) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
